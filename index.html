<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup: text encoding, mobile scaling, and the tab title
       (each page sets its own title once React starts) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WUBRG'r</title>

  <!--
    The site's icon (the open card binder), shown on the browser tab, in
    bookmarks, and on a phone's home screen. Browsers pick the size they
    need: 32px for tabs, 192px for Android, and "apple-touch-icon" (180px)
    for iPhones and iPads. The files are in the "public" folder; Vite adds
    the "/WUBRGr" part of the address in front of these paths.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!--
    Installing the site as an app (on a computer, Android phone or iPhone).
    The "manifest" file (public/manifest.webmanifest) tells the browser:
      - name / short_name: the app's name, under its icon
      - start_url / scope: the app opens at the home page, and every page
        of the site belongs to it
      - display "standalone": it opens in its own window, without the
        browser's address bar and tabs
      - background_color / theme_color: the dark color shown while it
        starts up, and for the window's title bar
      - icons: the open-binder picture in two sizes, plus a "maskable" one
        with extra space around it, so phones can crop it into a circle or
        rounded square without cutting off the binder
    "theme-color" colors the browser's bar on phones to match. The
    "apple-mobile-web-app" lines do the same job on iPhones and iPads:
    open in its own window, with this name under the icon.
  -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#14151a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WUBRG'r">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!--
    This tiny script runs BEFORE the page draws, so the saved light/dark
    choice is applied right away. Without it, the page could flash the
    wrong colors while React starts up. It reads the same saved "theme"
    as the original site (src/lib/theme.ts keeps it up to date).
  -->
  <script>
    (function () {
      var theme = null;
      // Try to read the saved theme. Some browsers block storage, so we guard it.
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      // No saved choice? Follow the device's own light/dark setting.
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- React draws the whole app inside this empty box -->
  <div id="root"></div>

  <!-- The app's starting file (Vite turns it into plain JavaScript) -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
